<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eunoia | Themes</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/themes.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="dashboard-body">

<div class="sidebar">

    <div class="brand">

        <h2>Eunoia</h2>
        <span>Themes</span>

    </div>

    <nav>

        <button onclick="location.href='dashboard.html'">🏠 Dashboard</button>
        <button onclick="location.href='journal.html'">📝 Journal</button>
        <button onclick="location.href='mood.html'">😊 Mood</button>
        <button onclick="location.href='habits.html'">🌱 Habits</button>
        <button onclick="location.href='goals.html'">🎯 Goals</button>
        <button onclick="location.href='insights.html'">📊 Insights</button>
        <button class="active">🎨 Themes</button>

    </nav>

    <button id="logoutBtn" class="logout">Logout</button>

</div>

<div class="content">

<header>

    <h1>Customize Your Experience</h1>
    <p id="currentDate"></p>

</header>

<section class="themes-grid">

    <div class="card">

        <h2>Choose Theme</h2>

        <button class="theme-btn" data-theme="theme-dark">🌙 Dark Calm</button>
        <button class="theme-btn" data-theme="theme-ocean">🌊 Ocean Blue</button>
        <button class="theme-btn" data-theme="theme-forest">🌿 Forest Green</button>
        <button class="theme-btn" data-theme="theme-sunset">🌅 Sunset</button>

    </div>

    <div class="card">

        <h2>Preview</h2>

        <div class="preview-box">

            <h3>Eunoia Preview</h3>
            <p>This is how your app will feel.</p>

            <div class="preview-card"></div>

        </div>

    </div>

</section>

</div>

<script src="js/app.js"></script>
<script src="js/themes.js"></script>

</body>

</html>
