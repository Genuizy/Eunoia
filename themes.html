    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body class="dashboard-body">

<div class="sidebar">

    <div class="brand">

        <h2>Eunoia</h2>

    </div>

<nav class="sidebar-nav">

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="journal.html">📝 Journal</a>

    <button id="logoutBtn" class="logout">Logout</button>

<header>

    <p id="currentDate"></p>

</header>

<section class="themes-grid">

    <div class="card">

        <h2>Choose Theme</h2>

        <button class="theme-btn" data-theme="theme-dark">🌙 Dark Calm</button>
        <button class="theme-btn" data-theme="theme-ocean">🌊 Ocean Blue</button>
        <button class="theme-btn" data-theme="theme-forest">🌿 Forest Green</button>
        <button class="theme-btn" data-theme="theme-sunset">🌅 Sunset</button>

    </div>

    <div class="card">

        <h2>Preview</h2>

        <div class="preview-box">

            <h3>Eunoia Preview</h3>
            <p>This is how your app will feel.</p>

            <div class="preview-card"></div>

        </div>
