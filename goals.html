<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eunoia | Goals</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/goals.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="dashboard-body">

<div class="sidebar">

    <div class="brand">

        <h2>Eunoia</h2>
        <span>Goals</span>

    </div>

    <nav>

        <button onclick="location.href='dashboard.html'">🏠 Dashboard</button>
        <button onclick="location.href='journal.html'">📝 Journal</button>
        <button onclick="location.href='mood.html'">😊 Mood</button>
        <button onclick="location.href='habits.html'">🌱 Habits</button>
        <button class="active">🎯 Goals</button>
        <button>📊 Insights</button>

    </nav>

    <button id="logoutBtn" class="logout">Logout</button>

</div>

<div class="content">

<header>

    <h1>Your Goals</h1>
    <p id="currentDate"></p>

</header>

<section class="goals-grid">

    <!-- Create Goal -->
    <div class="card">

        <h2>Create Goal</h2>

        <input id="goalTitle" type="text" placeholder="e.g. Get Fit">

        <textarea id="goalDesc" placeholder="Describe your goal..."></textarea>

        <button id="addGoalBtn">➕ Add Goal</button>

    </div>

    <!-- Goals List -->
    <div class="card">

        <h2>Active Goals</h2>

        <div id="goalsList"></div>

    </div>

</section>

</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/goals.js"></script>

</body>

</html>
