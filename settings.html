<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eunoia | Settings</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/settings.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="dashboard-body">

<div class="sidebar">

    <div class="brand">

        <h2>Eunoia</h2>
        <span>Settings</span>

    </div>

    <nav>

        <button onclick="location.href='dashboard.html'">🏠 Dashboard</button>
        <button onclick="location.href='journal.html'">📝 Journal</button>
        <button onclick="location.href='mood.html'">😊 Mood</button>
        <button onclick="location.href='habits.html'">🌱 Habits</button>
        <button onclick="location.href='goals.html'">🎯 Goals</button>
        <button onclick="location.href='insights.html'">📊 Insights</button>
        <button class="active">⚙ Settings</button>

    </nav>

    <button id="logoutBtn" class="logout">Logout</button>

</div>

<div class="content">

<header>

    <h1>Settings</h1>
    <p id="currentDate"></p>

</header>

<section class="settings-grid">

    <!-- Export -->
    <div class="card">

        <h2>📦 Export Data</h2>

        <p>Download all your Eunoia data as a JSON file.</p>

        <button id="exportBtn">Export</button>

    </div>

    <!-- Reset -->
    <div class="card">

        <h2>🧹 Reset App</h2>

        <p>This will delete all data permanently.</p>

        <button id="resetBtn" style="background:#ef4444">Reset</button>

    </div>

    <!-- Lock -->
    <div class="card">

        <h2>🔐 Lock App</h2>

        <p>Lock Eunoia so only you can access it.</p>

        <button id="lockBtn">Lock</button>

    </div>

</section>

</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/settings.js"></script>

</body>

</html>
