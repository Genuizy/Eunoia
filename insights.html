<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eunoia | Insights</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/insights.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="dashboard-body">

<div class="sidebar">

    <div class="brand">

        <h2>Eunoia</h2>
        <span>Insights</span>

    </div>

  <nav class="sidebar-nav">

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="journal.html">📝 Journal</a>
    <a href="mood.html">😊 Mood</a>
    <a href="habits.html">🌱 Habits</a>
    <a href="goals.html">🎯 Goals</a>
    <a href="insights.html">📊 Insights</a>
    <a href="safety.html">🛟 Safety</a>
    <a href="settings.html">⚙ Settings</a>

</nav>

    <button id="logoutBtn" class="logout">Logout</button>

</div>

<div class="content">

<header>

    <h1>Your Insights</h1>
    <p id="currentDate"></p>

</header>

<section class="insights-grid">

    <!-- Summary Cards -->
    <div class="card">
        <h3>📝 Journal Entries</h3>
        <h2 id="stat-journals">0</h2>
    </div>

    <div class="card">
        <h3>😊 Mood Entries</h3>
        <h2 id="stat-moods">0</h2>
    </div>

    <div class="card">
        <h3>🌱 Habits</h3>
        <h2 id="stat-habits">0</h2>
    </div>

    <div class="card">
        <h3>🎯 Goals</h3>
        <h2 id="stat-goals">0</h2>
    </div>

</section>

<!-- Mood Insight -->
<section class="card insight-block">

    <h2>📊 Mood Overview</h2>

    <p id="mood-summary">Analyzing your mood data...</p>

</section>

<!-- Habit Insight -->
<section class="card insight-block">

    <h2>🔥 Habit Activity</h2>

    <p id="habit-summary">Analyzing habits...</p>

</section>

<!-- Goal Insight -->
<section class="card insight-block">

    <h2>🎯 Goal Progress</h2>

    <p id="goal-summary">Analyzing goals...</p>

</section>

</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/insights.js"></script>

</body>

</html>
